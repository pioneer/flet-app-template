[project]
name = "flet-app-template"
version = "0.1.0"
description = "Reusable Python and Flet application template"
requires-python = ">=3.13"
dependencies = ["flet==1.0.1"]

[dependency-groups]
dev = [
    "flet[all]==1.0.1",
    "flet-mcp==1.0.1",
    "invoke>=2.2,<3",
    "pytest>=8,<10",
    "ruff>=0.13,<1",
    "pyright>=1.1.400,<2",
    "pillow>=11,<13",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["build", "dist", "src/assets", "src/.flet"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "tasks.py"]
exclude = ["src/assets", "src/.flet", "**/__pycache__"]
extraPaths = ["src", "."]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"

[tool.flet]
product = "Flet App Template"
org = "com.example"
bundle_id = "com.example.fletapptemplate"
company = "Template Organization"
build_number = 1
icon_background = "#ffffff"

[tool.flet.app]
path = "src"
module = "main"
exclude = ["__pycache__", ".flet"]

[tool.flet.web]
route_url_strategy = "hash"

[tool.flet.compile]
app = true

[tool.flet.cleanup]
app = false