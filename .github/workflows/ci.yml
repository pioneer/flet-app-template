name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run inv format-check
      - run: uv run inv lint
      - run: uv run inv typecheck
      - run: uv run inv test

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            os: ubuntu-latest
            task: build-web
          - target: apk
            os: ubuntu-latest
            task: build-android
          - target: aab
            os: ubuntu-latest
            task: build-android-aab
          - target: linux
            os: ubuntu-latest
            task: build-linux
          - target: windows
            os: windows-latest
            task: build-windows
          - target: macos
            os: macos-latest
            task: build-macos
          - target: ios-simulator
            os: macos-latest
            task: build-ios-simulator
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"
          enable-cache: true
      - run: uv sync --locked
      - name: Linux build prerequisites
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Build
        run: uv run inv ${{ matrix.task }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: build/${{ matrix.target }}/
          if-no-files-found: error